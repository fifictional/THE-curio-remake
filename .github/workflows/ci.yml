name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: api (typecheck + tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: curio
          POSTGRES_PASSWORD: curio
          POSTGRES_DB: curio
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U curio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      qdrant:
        image: qdrant/qdrant:latest
        ports: ['6433:6333']

    env:
      DATABASE_URL: postgres://curio_app:curio_app@localhost:5433/curio
      DATABASE_URL_OWNER: postgres://curio:curio@localhost:5433/curio
      BETTER_AUTH_SECRET: ci-secret-0000000000000000000000000000
      BETTER_AUTH_URL: http://localhost:3101
      QDRANT_URL: http://localhost:6433

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Migrate
        run: npm run db:migrate

      - name: Row-level security + app role
        run: npm run db:rls

      - name: Typecheck
        run: npm run type-check

      - name: Unit + integration tests
        run: npm test

      - name: Qdrant round-trip
        run: npm run qdrant:smoke

      - name: Start the API
        run: |
          npm start > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3101/__hello > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:3101/__hello > /dev/null || { cat /tmp/api.log; exit 1; }

      - name: API contract sweep (auth boundary, bridge, retrieval, pipeline)
        run: npm run verify:api

  web:
    name: web (typecheck + build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - run: npx tsc --noEmit
        working-directory: web

      - run: npm run build
        working-directory: web
