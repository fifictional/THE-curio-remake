services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: curio
      POSTGRES_PASSWORD: curio
      POSTGRES_DB: curio
    ports: ["5433:5432"]
    volumes: ["curio-pg:/var/lib/postgresql/data"]

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6433:6333"]
    volumes: ["curio-qdrant:/qdrant/storage"]

volumes:
  curio-pg:
  curio-qdrant:
